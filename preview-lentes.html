<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BARCH — prévia do fluxo de lentes</title>
  <style>body{margin:0;background:#f5efe9;color:#3a2e26;font:15px/1.5 Arial,sans-serif}main{width:620px;max-width:calc(100% - 32px);margin:48px auto;background:#fff;border-radius:16px;padding:32px;box-sizing:border-box;box-shadow:0 16px 50px #3a2e2620}.brand{font-size:29px;letter-spacing:7px}.tabs{display:flex;gap:8px;margin:22px 0}.tabs a{border:1px solid #8a6d5b;border-radius:8px;padding:9px 12px;color:inherit;text-decoration:none}.tabs a.on{background:#3a2e26;color:#fff}h1{font-size:25px;font-weight:500}p{color:#75675e}.js-addtocart{display:none}small{display:block;margin-top:20px;color:#75675e}@media(max-width:600px){main{margin:0;min-height:100vh;max-width:none;width:100%;border-radius:0;padding:24px}}</style>
</head>
<body><main>
  <div class="brand">BARCH</div>
  <nav class="tabs"><a id="comum" href="?tipo=comum">Armação comum</a><a id="sem_aro" href="?tipo=sem_aro">Armação sem aro</a></nav>
  <h1 id="product-title">Armação BARCH para teste</h1>
  <p>Prévia do fluxo. A receita pode ser lida automaticamente, mas o carrinho é apenas demonstrativo.</p>
  <form id="product_form"><input type="hidden" name="add_to_cart" value="1"><input type="hidden" name="quantity" value="1"><button class="js-addtocart" type="button" disabled aria-hidden="true"></button></form>
  <small>Preço fictício da armação: R$ 199,00. Os preços das lentes seguem a planilha recebida.</small>
</main>
<script>
  window.BARCH_LENTES_PREVIEW=true;
  window.LS={product:{name:'Armação BARCH para teste'},variants:[{price_number:199}]};
  var type=new URLSearchParams(location.search).get('tipo')==='sem_aro'?'sem_aro':'comum';
  var title=type==='sem_aro'?'Armação sem aro BARCH para teste':'Armação comum BARCH para teste';
  document.getElementById('product-title').textContent=title;window.LS.product.name=title;document.getElementById(type).className='on';
</script>
<script src="lentes-barch.js"></script>
</body></html>
